<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <title>Discografia</title>

    <!-- Favicon simples (emoji embutido, sem precisar de um arquivo à parte) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%BF%3C/text%3E%3C/svg%3E" />

    <!-- Fonte usada só no logo/títulos em destaque. O texto normal do site
       usa a fonte padrão do sistema (mais legível e mais rápida). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div id="app">

        <!-- ==================================================================
         TELA 1 — PRATELEIRA DE ÁLBUNS
         Por padrão vem escondida (hideLibraryByDefault em config.js) —
         só é possível abrir um álbum pelo link direto dele.
    =================================================================== -->
        <section id="screen-library" class="screen-library">
            <header class="topbar">
                <span class="wordmark" data-site-name>Hama Disco</span>
            </header>

            <div class="shelf-wrap">
                <div id="album-shelf" class="shelf">
                    <!-- preenchido por js/app.js -->
                </div>

                <p id="empty-state" class="empty-state" hidden>
                    Nenhum álbum cadastrado ainda. Copie os arquivos de áudio para
                    <code>/albums/&lt;nome&gt;/</code> e cadastre o álbum em
                    <code>js/albums.js</code> — o <code>README.md</code> tem o passo a passo completo. Enquanto isso, você pode testar o player com o card "Tocar arquivo" ao lado.
                </p>
            </div>
        </section>

        <!-- ==================================================================
         TELA 2 — PLAYER
    =================================================================== -->
        <section id="screen-player" class="screen-player" hidden>
            <header class="player-topbar">
                <button id="back-button" type="button" class="back-button" aria-label="Voltar para a prateleira">‹</button>
                <span id="player-context" class="player-context"></span>
            </header>

            <div class="player-body">
                <div class="record-wrap">
                    <div id="record" class="record">
                        <div id="record-art" class="record__art"></div>
                    </div>
                </div>

                <div class="now-playing">
                    <p id="track-title" class="track-title"></p>
                    <p id="track-meta" class="track-meta"></p>
                </div>

                <div class="progress-row">
                    <span id="time-current" class="time">0:00</span>
                    <input type="range" id="seek" class="seek" min="0" max="100" value="0" step="0.1" aria-label="Progresso da faixa" />
                    <span id="time-total" class="time">0:00</span>
                </div>

                <div class="transport">
                    <button id="prev-button" type="button" class="transport-btn" aria-label="Faixa anterior">⏮</button>
                    <button id="play-button" type="button" class="transport-btn transport-btn--play" aria-label="Tocar">▶</button>
                    <button id="next-button" type="button" class="transport-btn" aria-label="Próxima faixa">⏭</button>
                </div>

                <ol id="tracklist" class="tracklist">
                    <!-- preenchido por js/app.js -->
                </ol>
            </div>

            <!-- Tela de "toque pra tocar": necessária porque o navegador bloqueia
           som automático sem uma interação direta do usuário na página. -->
            <div id="boot-overlay" class="boot-overlay">
                <div id="boot-art" class="boot-overlay__art"></div>
                <p id="boot-title" class="boot-title"></p>
                <p id="boot-artist" class="boot-artist"></p>
                <button id="boot-play" type="button" class="boot-play">▶ Tocar álbum</button>
            </div>

            <div id="finished-overlay" class="finished-overlay" hidden>
                <p>Você ouviu o álbum inteiro. 🎉</p>
                <button id="replay-button" type="button" class="boot-play">↻ Tocar de novo</button>
            </div>

            <audio id="audio-player"></audio>
        </section>

    </div>

    <!-- Ordem importa: config e a lista de álbuns precisam existir antes de
       app.js rodar. -->
    <script src="js/config.js"></script>
    <script src="js/albums.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
